# Personhood CI — verifies every PR builds cleanly with race detector and
# with the production build tags. Web app build is verified separately.
#
# Security note: this workflow runs ONLY trusted, pre-checked-out repo
# content (go test, npm ci, docker build). It does NOT consume any
# github.event.* user-controlled inputs in run: steps, so injection risk
# is minimal.

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            **/go.sum
      # Every module listed in go.work, so a new method module is covered the
      # moment it is added to the workspace.
      - name: Test default build (all go.work modules)
        run: bash scripts/test-all.sh
      - name: Test with -tags sendgrid
        run: cd src/methods/email && go test -race -count=1 -tags sendgrid ./...
      - name: Test with -tags twilio
        run: cd src/methods/sms && go test -race -count=1 -tags twilio ./...
      - name: Test server with both tags
        run: cd src/server && go test -race -count=1 -tags 'sendgrid twilio' ./...
      - name: Build server (production tags)
        run: cd src/server && go build -tags 'sendgrid twilio' -o /tmp/personhood-server ./cmd/server
      # Round-1 path against a real server process (also covered by tests/,
      # which test-all.sh runs; this is the human-runnable form).
      - name: End-to-end email enrollment (scripts/e2e-email.sh)
        run: bash scripts/e2e-email.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: cd app/web && npm ci --no-audit --no-fund
      - name: Type-check
        run: cd app/web && npm run typecheck
      - name: Build
        run: cd app/web && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: personhood-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
