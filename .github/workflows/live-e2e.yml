# Live e2e — re-proves the deployed path every 6 hours, the way a phone user
# and OpenLine use it: API enrollment + policy check (e2e-remote.sh), the
# Personhood → OpenLine handshake without touching the ledger
# (e2e-openline.sh), and the real web app in headless Chrome at a 390x844
# phone viewport (phone-check.mjs). A failure here is the alert: GitHub mails
# the workflow owner when a scheduled run fails.
#
# Needs the repository secret PERSONHOOD_INVITE_CODE while the issuer is
# invite-gated; without it the job is skipped rather than failing. Runs only
# repo-owned scripts; no github.event.* input reaches a run: step.

name: live-e2e

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-e2e
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUER: https://personhood-issuer-664594784582.us-central1.run.app
      WEB_URL: https://personhood-web.web.app
      PERSONHOOD_INVITE_CODE: ${{ secrets.PERSONHOOD_INVITE_CODE }}
      # Optional: when set, e2e-remote also revokes its own credential and
      # checks verifiers reject it.
      PERSONHOOD_ADMIN_TOKEN: ${{ secrets.PERSONHOOD_ADMIN_TOKEN }}
    steps:
      - name: Skip without an invite code
        id: gate
        run: |
          if [ -z "$PERSONHOOD_INVITE_CODE" ]; then
            echo "PERSONHOOD_INVITE_CODE secret not set; skipping live e2e" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-go@v7
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            **/go.sum
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - name: API enrollment against the live issuer
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/e2e-remote.sh "$ISSUER" "$PERSONHOOD_INVITE_CODE"
      - name: OpenLine handshake (no ledger writes)
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/e2e-openline.sh
      - name: Install axe-core (pinned) for the accessibility scan
        if: steps.gate.outputs.run == 'true'
        run: npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/axe" axe-core@4.14.0
      - name: Phone-viewport browser run
        if: steps.gate.outputs.run == 'true'
        env:
          CHROME: /usr/bin/google-chrome
          OUT: phone-check
        run: AXE="$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" node scripts/phone-check.mjs "$WEB_URL"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: phone-check-screenshots
          path: phone-check/
          if-no-files-found: ignore
